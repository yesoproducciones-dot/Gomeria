<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f5f5f0;color:#1a1a1a;font-size:16px}
.banner{background:#FDD835;border-bottom:4px solid #1a1a1a}
.banner-inner{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;max-width:900px;margin:0 auto}
.banner-logo{display:flex;align-items:center;gap:14px}
.banner-icon{font-size:36px}
.banner-title{font-size:22px;font-weight:900;letter-spacing:-0.5px;color:#1a1a1a;text-transform:uppercase;line-height:1}
.banner-title span{color:#C0392B}
.banner-sub{font-size:11px;font-weight:700;color:#C0392B;letter-spacing:1px;text-transform:uppercase;margin-top:1px}
.banner-info{text-align:right;font-size:11px;color:#333;line-height:1.6}
.banner-info strong{font-size:13px;color:#1a1a1a}
.topbar{background:#1a1a1a;padding:8px 16px;display:flex;align-items:center;gap:4px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav button{background:transparent;border:1px solid transparent;border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;color:#aaa;transition:all .15s;font-weight:500}
.nav button.active{background:#FDD835;border-color:#FDD835;color:#1a1a1a}
.nav button:hover:not(.active){background:#333;color:#fff}
.local-badge{margin-left:auto;background:#333;border:1px solid #555;border-radius:6px;padding:5px 10px;font-size:11px;color:#FDD835;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px}
.local-badge:hover{background:#444}
.content{padding:16px;max-width:900px;width:100%;margin:0 auto}
.card{background:#fff;border:1px solid #e8e8e0;border-radius:12px;padding:16px;margin-bottom:10px}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px}
.badge-recibido{background:#E6F1FB;color:#185FA5}
.badge-proceso{background:#FAEEDA;color:#854F0B}
.badge-listo{background:#EAF3DE;color:#3B6D11}
.badge-entregado{background:#F1EFE8;color:#5F5E5A}
.local-3619{border-left:3px solid #C0392B}
.local-3391{border-left:3px solid #2980B9}
.local-avellaneda{border-left:3px solid #27AE60}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.stat-card{background:#fff;border:1px solid #e8e8e0;border-radius:10px;padding:12px;text-align:center}
.stat-num{font-size:22px;font-weight:700}
.stat-lbl{font-size:11px;color:#888;margin-top:2px}
.btn{background:#fff;border:1px solid #ddd;border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer;color:#1a1a1a;transition:all .15s}
.btn:hover{background:#f5f5f0}
.btn-primary{background:#1a1a1a;border-color:#1a1a1a;color:#fff}
.btn-primary:hover{background:#333}
.btn-yellow{background:#FDD835;border-color:#FDD835;color:#1a1a1a;font-weight:600}
.btn-yellow:hover{background:#F9C800}
.btn-danger{background:#fff;border:1px solid #e74c3c;color:#e74c3c;border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer}
.btn-danger:hover{background:#FCEBEB}
.btn-edit{background:#f5f5f0;border:1px solid #ddd;border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;color:#1a1a1a}
.btn-edit:hover{background:#e8e8e0}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-link{background:transparent;border:none;color:#C0392B;font-size:12px;cursor:pointer;padding:0;text-decoration:underline}
.input{width:100%;border:1px solid #ddd;border-radius:8px;padding:8px 10px;font-size:13px;background:#fff;color:#1a1a1a;transition:border .15s}
.input:focus{outline:none;border-color:#1a1a1a}
.select{width:100%;border:1px solid #ddd;border-radius:8px;padding:8px 10px;font-size:13px;background:#fff;color:#1a1a1a}
.select:focus{outline:none;border-color:#1a1a1a}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.form-group{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.form-label{font-size:12px;color:#666;font-weight:500}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:flex-start;justify-content:center;z-index:100;padding:16px;overflow-y:auto}
.modal{background:#fff;border-radius:14px;border:1px solid #e8e8e0;padding:20px;width:100%;max-width:520px;margin:auto}
.modal-title{font-size:16px;font-weight:700;margin-bottom:16px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.label{font-size:12px;color:#888}
.placa{font-family:monospace;font-size:13px;font-weight:700;background:#f5f5f0;padding:2px 8px;border-radius:6px;letter-spacing:1px}
.stock-low{color:#C0392B;font-weight:700}
.empty{text-align:center;padding:40px;color:#aaa;font-size:13px}
.divider{border:none;border-top:1px solid #f0f0e8;margin:12px 0}
.error-msg{background:#FCEBEB;border:1px solid #F09595;border-radius:8px;padding:10px 14px;font-size:13px;color:#A32D2D;margin-bottom:12px}
.success-msg{background:#EAF3DE;border:1px solid #C0DD97;border-radius:8px;padding:10px 14px;font-size:13px;color:#3B6D11;margin-bottom:12px}
.loading{text-align:center;padding:40px;color:#888}
.search-bar{display:flex;gap:8px;margin-bottom:14px}
.seccion-titulo{font-size:11px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;margin-top:4px}

.tag-x{cursor:pointer;color:#aaa;font-size:14px;line-height:1}.tag-x:hover{color:#C0392B}
.servicios-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.servicio-chip{border:1px solid #ddd;border-radius:20px;padding:5px 12px;font-size:12px;cursor:pointer;background:#fff;color:#555;transition:all .15s;user-select:none}

.order-item-row:last-child{border-bottom:none}
.total-row{display:flex;justify-content:space-between;font-size:14px;font-weight:700;padding-top:8px}
.local-selector{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.local-opt{border:2px solid #ddd;border-radius:10px;padding:10px 8px;text-align:center;cursor:pointer;font-size:11px;font-weight:600;transition:all .15s;line-height:1.3}
.local-opt:hover{border-color:#1a1a1a}
.local-opt.sel-3619{border-color:#C0392B;background:#FEF0EE;color:#C0392B}
.local-opt.sel-3391{border-color:#2980B9;background:#EBF5FB;color:#2980B9}
.local-opt.sel-avellaneda{border-color:#27AE60;background:#EAFAF1;color:#27AE60}
/* PIN */
.pin-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:200}
.pin-box{background:#fff;border-radius:16px;padding:28px;width:300px;text-align:center}
.pin-title{font-size:16px;font-weight:700;margin-bottom:6px}
.pin-sub{font-size:13px;color:#888;margin-bottom:20px}
.pin-dots{display:flex;justify-content:center;gap:10px;margin-bottom:20px}
.pin-dot{width:14px;height:14px;border-radius:50%;background:#e8e8e0;transition:all .15s}
.pin-dot.filled{background:#1a1a1a}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pin-btn{border:1px solid #ddd;border-radius:10px;padding:14px;font-size:18px;font-weight:600;cursor:pointer;background:#fff;transition:all .15s}
.pin-btn:hover{background:#f5f5f0;border-color:#1a1a1a}
.pin-btn.del{font-size:14px;color:#C0392B}
.pin-error{color:#C0392B;font-size:12px;margin-top:8px;height:18px}
/* STOCK EDITOR */
.stock-item-editor{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid #f0f0e8}
.stock-item-editor:last-child{border-bottom:none}
.qty-control{display:flex;align-items:center;gap:4px}
.qty-btn{width:28px;height:28px;border-radius:6px;border:1px solid #ddd;background:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:600;line-height:1}
.qty-btn:hover{background:#f5f5f0;border-color:#1a1a1a}
.qty-val{min-width:36px;text-align:center;font-size:15px;font-weight:700}
.stock-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filter-chip{border:1px solid #ddd;border-radius:20px;padding:4px 12px;font-size:12px;cursor:pointer;background:#fff;color:#555;transition:all .15s}
.filter-chip.active{background:#1a1a1a;border-color:#1a1a1a;color:#fff}
.filter-chip:hover:not(.active){border-color:#1a1a1a}
.metodo-btn{border:1px solid #ddd;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;background:#fff;color:#555;transition:all .15s;font-weight:500}
.metodo-btn:hover{border-color:#1a1a1a;color:#1a1a1a}
.metodo-btn.active{background:#1a1a1a;border-color:#1a1a1a;color:#fff}
@media(max-width:600px){
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .grid2,.grid3,.local-selector{grid-template-columns:1fr}
  .banner-info{display:none}
  .banner-title{font-size:18px}
}
</style>
</head>

<script>
const SUPABASE_URL = 'https://dksoqjmlrqwuarstbhrv.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRrc29xam1scnF3dWFyc3RiaHJ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2Nzg4MTEsImV4cCI6MjA5MzI1NDgxMX0.v2SQErOn9oflnkUi21TvVH1cci-xKnEd6Dl82Vnry4I';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ═══ CONFIGURACIÓN ════════════════════════════════════════════
const PIN_EMPLEADO = '1234';  // ← empleados (crear órdenes/clientes)
const PIN_DUENO    = '6265';  // ← dueño (editar/borrar stock)

const LOCALES = {
  'gaona3619':  { nombre:'Gaona 3619',  full:'Av. Gaona 3619',      dot:'🔴', color:'#C0392B', cls:'local-3619',      selcls:'sel-3619'      },
  'gaona3391':  { nombre:'Gaona 3391',  full:'Av. Gaona 3391',      dot:'🔵', color:'#2980B9', cls:'local-3391',      selcls:'sel-3391'      },
  'avellaneda': { nombre:'Avellaneda',  full:'Av. Avellaneda 4140', dot:'🟢', color:'#27AE60', cls:'local-avellaneda',selcls:'sel-avellaneda'},
};

const ESTADOS = ['recibido','en proceso','listo','entregado'];
const ESTADO_LABELS = {recibido:'Recibido','en proceso':'En proceso',listo:'Listo',entregado:'Entregado'};

const SERVICIOS_PREDEFINIDOS = [
  'Reparación de pinchazo','Cambio de cubierta','Balanceo','Alineación',
  'Cambio de válvula','Inflado con nitrógeno','Rotación de cubiertas',
  'Desmontaje y montaje','Revisión general','Reparación de llanta',
];

const ERRORES = {
  'row-level security':'Sin permiso. Desactivá RLS en Supabase.',
  'violates foreign key':'El registro tiene datos relacionados y no se puede eliminar.',
  'duplicate key':'Ya existe un registro con ese valor (ej: patente duplicada).',
  'null value in column':'Falta completar un campo obligatorio.',
  'JWT expired':'La sesión expiró. Recargá la página.',
  'Failed to fetch':'Sin conexión. Verificá tu red.',
};
function traducirError(msg=''){
  for(const [k,v] of Object.entries(ERRORES)) if(msg.includes(k)) return v;
  return 'Ocurrió un error inesperado. Intentá de nuevo.';
}

let state = {
  tab:'dashboard', localActual:'gaona3619',
  clientes:[], vehiculos:[], ordenes:[], stock:[], ordenInsumos:[], empleados:[], gastos:[],
  searchCliente:'', searchOrden:'', searchStock:'', filtroStockLocal:'todos',
  filtroFecha:'todos', filtroEmpleado:'', filtroServicio:'', filtroMetodo:'',
  filtroFechaDesde:'', filtroFechaHasta:'',
  loading:false, error:null,
  pinEmpleadoOk:false, pinDuenoOk:false,
  empleadoActual:null,
  totalVisible:false,
};

// ═══ LOCAL ════════════════════════════════════════════════════
function localInfo(id){ return LOCALES[id]||LOCALES['gaona3619']; }
function setLocal(id){
  state.localActual=id;
  const l=localInfo(id);
  document.getElementById('topbar-local-dot').textContent=l.dot;
  document.getElementById('topbar-local-nombre').textContent=l.nombre;
  closeModal(); render();
}
function showCambiarLocal(){
  document.getElementById('modal-container').innerHTML=`
  <div class="modal-overlay" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()" style="max-width:360px">
      <div class="modal-title">Seleccioná tu local</div>
      <div class="local-selector">
        ${Object.entries(LOCALES).map(([id,l])=>`
          <div class="local-opt ${state.localActual===id?l.selcls:''}" onclick="setLocal('${id}')">
            <div style="font-size:20px;margin-bottom:4px">${l.dot}</div>
            <div style="font-size:10px">GOMERÍA J&Y</div>
            <div>${l.full}</div>
          </div>`).join('')}
      </div>
      <button class="btn" style="width:100%" onclick="closeModal()">Cancelar</button>
    </div>
  </div>`;
}

// ═══ PIN ══════════════════════════════════════════════════════
let _pinBuf='', _pinCb=null, _pinNivel='empleado';

function showPin(nivel, callback){
  if(nivel==='empleado' && state.pinEmpleadoOk){ callback(); return; }
  if(nivel==='dueno'    && state.pinDuenoOk)   { callback(); return; }
  _pinBuf=''; _pinCb=callback; _pinNivel=nivel;
  const titulo = nivel==='dueno' ? '🔐 Acceso exclusivo dueño' : '🔒 Ingresá tu DNI';
  const sub    = nivel==='dueno' ? 'Ingresá el PIN del dueño' : 'Cada empleado ingresa con su número de DNI';
  const maxDots = nivel==='dueno' ? 4 : 8;
  document.getElementById('pin-container').innerHTML=`
  <div class="pin-overlay">
    <div class="pin-box">
      <div class="pin-title">${titulo}</div>
      <div class="pin-sub">${sub}</div>
      <div class="pin-dots" id="pin-dots-container">
        ${[...Array(maxDots)].map((_,i)=>`<div class="pin-dot" id="pd${i}"></div>`).join('')}
      </div>
      <div class="pin-grid">
        ${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(n=>`
          <button class="pin-btn ${n==='⌫'?'del':''}" onclick="pinPress('${n}')">${n}</button>`).join('')}
      </div>
      <div class="pin-error" id="pin-error"></div>
      <button class="btn" style="width:100%;margin-top:12px" onclick="closePinScreen()">Cancelar</button>
    </div>
  </div>`;
  document.addEventListener('keydown', _pinKeyHandler);
}

window.pinPress=function(val){
  const maxLen = _pinNivel==='dueno' ? 4 : 8;
  if(val==='⌫'){_pinBuf=_pinBuf.slice(0,-1);updatePinDots();return;}
  if(val===''||_pinBuf.length>=maxLen) return;
  _pinBuf+=val; updatePinDots();
  // Validar automáticamente al completar
  clearTimeout(window._pinTimeout);
  if(_pinBuf.length===maxLen){
    window._pinTimeout = setTimeout(()=>{ validarPin(); }, 200);
  } else {
    const minLen = _pinNivel==='dueno' ? 4 : 6;
    if(_pinBuf.length >= minLen) {
      window._pinTimeout = setTimeout(()=>{ validarPin(); }, 800);
    }
  }
};

function validarPin(){
  // Aceptar si tiene al menos 4 dígitos (PIN dueño) o 6 (DNI empleado)
  if(_pinBuf.length < 4) return;
  const correcto_dueno = _pinBuf === PIN_DUENO;
  const empleadoMatch = state.empleados.find(e=>e.activo && e.dni && e.dni===_pinBuf);

  if(correcto_dueno){
    state.pinDuenoOk=true;
    state.pinEmpleadoOk=true;
    state.empleadoActual=null;
    closePinScreen();
    if(_pinCb) _pinCb();
  } else if(empleadoMatch){
    state.pinEmpleadoOk=true;
    state.empleadoActual=empleadoMatch;
    if(_pinNivel==='dueno'){
      // un empleado no puede acceder a zona de dueño
      _pinBuf=''; updatePinDots();
      const el=document.getElementById('pin-error');
      if(el){el.textContent='PIN incorrecto. Intentá de nuevo.';setTimeout(()=>{if(el)el.textContent=''},2500);}
      return;
    }
    closePinScreen();
    if(_pinCb) _pinCb();
  } else if(_pinBuf.length >= 6) {
    // Solo mostrar error si ya tiene suficientes dígitos
    _pinBuf=''; updatePinDots();
    const el=document.getElementById('pin-error');
    if(el){el.textContent='PIN incorrecto. Intentá de nuevo.';setTimeout(()=>{if(el)el.textContent=''},2500);}
  }
}

function updatePinDots(){
  const container=document.getElementById('pin-dots-container');
  if(!container) return;
  const maxDots = _pinNivel==='dueno' ? 4 : 8;
  container.innerHTML=[...Array(maxDots)].map((_,i)=>`<div class="pin-dot ${i<_pinBuf.length?'filled':''}" id="pd${i}"></div>`).join('');
}

function closePinScreen(){
  document.getElementById('pin-container').innerHTML='';
  document.removeEventListener('keydown', _pinKeyHandler);
}

function _pinKeyHandler(e){
  if(e.key>='0'&&e.key<='9') pinPress(e.key);
  else if(e.key==='Backspace') pinPress('⌫');
  else if(e.key==='Escape') closePinScreen();
  else if(e.key==='Enter'){ clearTimeout(window._pinTimeout); validarPin(); }
}

async function loadAll(){
  state.loading=true; render();
  try {
    const [c,v,o,s,oi]=await Promise.all([
      db.from('clientes').select('*').order('nombre'),
      db.from('vehiculos').select('*'),
      db.from('ordenes').select('*').order('fecha',{ascending:false}),
      db.from('stock').select('*').order('nombre'),
      db.from('orden_insumos').select('*'),
    ]);
    if(c.error) throw c.error;
    state.clientes=c.data||[]; state.vehiculos=v.data||[];
    state.ordenes=o.data||[]; state.stock=s.data||[];
    state.ordenInsumos=oi.data||[];
    // empleados por separado para no trabar si falla
    const em = await db.from('empleados').select('*').order('nombre');
    state.empleados=em.data||[];
    const ga = await db.from('gastos').select('*').order('fecha',{ascending:false});
    state.gastos=ga.data||[];
    state.error=null;
  } catch(e){ state.error=traducirError(e.message||''); }
  state.loading=false; render();
}

  state.pinEmpleadoOk=false;

function render(){

  if(state.loading){mc.innerHTML='<div class="loading">Cargando...</div>';return;}
  if(state.error){mc.innerHTML=`<div class="error-msg">${state.error}</div><button class="btn" onclick="loadAll()" style="margin-top:8px">Reintentar</button>`;return;}
  const map={dashboard:renderDashboard,ordenes:renderOrdenes,clientes:renderClientes,stock:renderStock,empleados:renderEmpleados,gastos:renderGastos,reportes:renderReportes};

}

function getFechaRango(filtro){
  const hoy=new Date(); hoy.setHours(0,0,0,0);
  if(filtro==='hoy') return [hoy.toISOString().slice(0,10), hoy.toISOString().slice(0,10)];
  if(filtro==='semana'){
    const lunes=new Date(hoy); lunes.setDate(hoy.getDate()-hoy.getDay()+1);
    return [lunes.toISOString().slice(0,10), hoy.toISOString().slice(0,10)];
  }
  if(filtro==='mes'){
    const inicio=new Date(hoy.getFullYear(),hoy.getMonth(),1);
    return [inicio.toISOString().slice(0,10), hoy.toISOString().slice(0,10)];
  }
  if(filtro==='mes_anterior'){
    const inicio=new Date(hoy.getFullYear(),hoy.getMonth()-1,1);
    const fin=new Date(hoy.getFullYear(),hoy.getMonth(),0);
    return [inicio.toISOString().slice(0,10), fin.toISOString().slice(0,10)];
  }
  return null;
}

function filtrarOrdenes(){
  let result=[...state.ordenes];
  const q=state.searchOrden.toLowerCase();
  if(q){
    result=result.filter(o=>{
      const v=getVehiculo(o.vehiculo_id),c=getCliente(o.vehiculo_id);
      return (v&&v.patente.toLowerCase().includes(q))||(c&&c.nombre.toLowerCase().includes(q));
    });
  }
  const rango=getFechaRango(state.filtroFecha);
  if(rango) result=result.filter(o=>o.fecha>=rango[0]&&o.fecha<=rango[1]);
  if(state.filtroFechaDesde) result=result.filter(o=>o.fecha>=state.filtroFechaDesde);
  if(state.filtroFechaHasta) result=result.filter(o=>o.fecha<=state.filtroFechaHasta);
  if(state.filtroEmpleado) result=result.filter(o=>o.empleado_id===state.filtroEmpleado);
  if(state.filtroServicio) result=result.filter(o=>(o.servicios||[]).some(s=>s.toLowerCase().includes(state.filtroServicio.toLowerCase())));
  if(state.filtroMetodo) result=result.filter(o=>(o.metodo_pago||'efectivo')===state.filtroMetodo);
  return result;
}

function renderStock(){

    nombresUnicos=nombresUnicos.filter(n=>state.stock.some(s=>s.nombre===n&&s.local===filtroLocal));

function renderStockItems() {

  const q = state.searchStock.toLowerCase();

  let nombresUnicos = [...new Set(state.stock.map(s=>s.nombre))].sort();
  if(q) nombresUnicos = nombresUnicos.filter(n=>n.toLowerCase().includes(q));
  if(filtroLocal!=='todos') nombresUnicos = nombresUnicos.filter(n=>state.stock.some(s=>s.nombre===n&&s.local===filtroLocal));
  if(nombresUnicos.length===0){el.innerHTML='<div class="empty">No se encontraron insumos</div>';return;}
  el.innerHTML = nombresUnicos.map(nombre=>{
    const items=state.stock.filter(s=>s.nombre===nombre);

    const totalQty=items.reduce((s,i)=>s+i.cantidad,0);

      <div style="font-weight:700;font-size:13px;margin-bottom:8px">${nombre}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">

          const bajo=it&&qty<=it.minimo;
          return `<div style="background:${bajo?'#FCEBEB':l.color+'15'};border:1px solid ${bajo?'#F09595':l.color+'40'};border-radius:8px;padding:8px 12px;min-width:110px">
            <div style="font-size:11px;font-weight:600;color:${l.color}">${l.dot} ${l.nombre}</div>
            <div style="font-size:20px;font-weight:700;color:${bajo?'#C0392B':'#1a1a1a'};margin-top:2px">${qty}</div>
            <div style="font-size:11px;color:#888">${it?it.unidad:'—'}${bajo?' · ⚠️ bajo':''}</div>
          </div>`;
        }).join('')}
        ${filtroLocal==='todos'?`<div style="background:#f5f5f0;border:1px dashed #ddd;border-radius:8px;padding:8px 12px;min-width:70px;display:flex;align-items:center;justify-content:center;flex-direction:column">

}

function showEditorStock(){

  function renderEditorItems(filtro=''){
    const q=filtro.toLowerCase();
    const nombres=nombresUnicos.filter(n=>!q||n.toLowerCase().includes(q));

      return `<div style="margin-bottom:12px">

        ${Object.entries(LOCALES).map(([lid,l])=>{

          if(!it) return `<div style="font-size:12px;color:#ccc;padding:4px 0">${l.dot} ${l.nombre}: no cargado</div>`;
          return `<div class="stock-item-editor">
            <div>
              <div style="font-size:12px;font-weight:600;color:${l.color}">${l.dot} ${l.nombre}</div>
              <div style="font-size:11px;color:#888">mín: ${it.minimo} ${it.unidad}</div>
            </div>
            <div class="qty-control">
              <button class="qty-btn" onclick="cambiarCantidad('${it.id}',-1)">−</button>
              <div class="qty-val" id="qty-${it.id}">${it.cantidad}</div>
              <button class="qty-btn" onclick="cambiarCantidad('${it.id}',1)">+</button>
              <input class="input" type="number" value="${it.cantidad}" style="width:60px;margin-left:4px;text-align:center"
                onchange="setCantidadDirecta('${it.id}',this.value)">
              <button class="btn-danger" onclick="confirmarBorrarInsumo('${it.id}','${nombre}','${l.nombre}')">🗑</button>
            </div>
          </div>`;
        }).join('')}
        <hr style="border:none;border-top:1px solid #f0f0e8;margin-top:8px">
      </div>`;
    }).join('');
  }

  document.getElementById('modal-container').innerHTML=`
  <div class="modal-overlay" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()" style="max-width:580px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <div class="modal-title" style="margin:0">✏️ Editor de stock</div>
        <span style="font-size:11px;background:#FDD835;padding:3px 8px;border-radius:6px;font-weight:700">Modo dueño</span>
      </div>
      <div style="font-size:12px;color:#888;margin-bottom:12px">Ajustá las cantidades o eliminá insumos. Los cambios se guardan al hacer clic en "Guardar cambios".</div>
      <div class="search-bar">
        <input class="input" placeholder="Buscar insumo..." oninput="document.getElementById('editor-items').innerHTML=renderEditorItemsFn(this.value)">
      </div>
      <div id="editor-items" style="max-height:60vh;overflow-y:auto">${renderEditorItems()}</div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
        <button class="btn" onclick="closeModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="guardarCambiosStock()">Guardar cambios</button>
      </div>
    </div>
  </div>`;

  // exponer la función para poder llamarla desde el input
  window.renderEditorItemsFn = renderEditorItems;
}

window.cambiarCantidad=function(id, delta){
  const it=window._stockEdit.find(s=>s.id===id); if(!it) return;
  it.cantidad=Math.max(0,it.cantidad+delta);
  const el=document.getElementById('qty-'+id);
  if(el) el.textContent=it.cantidad;
  // actualizar también el input de texto
  const inputs=document.querySelectorAll(`input[onchange*="${id}"]`);
  inputs.forEach(inp=>inp.value=it.cantidad);
};

window.setCantidadDirecta=function(id, val){
  const it=window._stockEdit.find(s=>s.id===id); if(!it) return;
  it.cantidad=Math.max(0,parseInt(val)||0);
  const el=document.getElementById('qty-'+id);
  if(el) el.textContent=it.cantidad;
};

window.confirmarBorrarInsumo=function(id, nombre, localNombre){
  if(!confirm(`¿Borrar "${nombre}" de ${localNombre}? Esta acción no se puede deshacer.`)) return;
  window._stockEdit=window._stockEdit.filter(s=>s.id!==id);
  // refrescar el editor
  const el=document.getElementById('editor-items');
  if(el&&window.renderEditorItemsFn) el.innerHTML=window.renderEditorItemsFn('');
};

window.guardarCambiosStock=async function(){
  const btn=document.querySelector('#modal-container .btn-primary');
  if(btn){btn.disabled=true;btn.textContent='Guardando...';}

  // IDs que quedaron en _stockEdit
  const idsRestantes=window._stockEdit.map(s=>s.id);
  // IDs que estaban antes
  const idsOriginales=state.stock.map(s=>s.id);
  // a borrar
  const aBorrar=idsOriginales.filter(id=>!idsRestantes.includes(id));

  let errores=[];

  // borrar eliminados
  for(const id of aBorrar){
    const {error}=await db.from('stock').delete().eq('id',id);
    if(error) errores.push(traducirError(error.message));
  }

  // actualizar cantidades modificadas
  for(const it of window._stockEdit){
    const original=state.stock.find(s=>s.id===it.id);
    if(original&&original.cantidad!==it.cantidad){
      const {error}=await db.from('stock').update({cantidad:it.cantidad}).eq('id',it.id);
      if(error) errores.push(traducirError(error.message));
    }
  }

  if(errores.length>0){
    alert('Algunos cambios no se pudieron guardar:\n'+errores.join('\n'));
  }

  await loadAll();
  closeModal();
};

window.guardarClienteDesdeOrden=async function(){
  const nombre=document.getElementById('nc2-nombre')?.value.trim();
  const telefono=document.getElementById('nc2-tel')?.value.trim();
  const email=document.getElementById('nc2-email')?.value.trim();
  const patente=document.getElementById('nc2-pat')?.value.trim();
  const marca=document.getElementById('nc2-marca')?.value.trim();
  const modelo=document.getElementById('nc2-modelo')?.value.trim();
  const errEl=document.getElementById('nc2-error');
  if(!nombre||!telefono){if(errEl)errEl.innerHTML='<div class="error-msg" style="margin-top:8px">Nombre y teléfono son obligatorios</div>';return;}
  const {data:nc,error}=await db.from('clientes').insert({nombre,telefono,email:email||null}).select().single();
  if(error){if(errEl)errEl.innerHTML=`<div class="error-msg" style="margin-top:8px">${traducirError(error.message)}</div>`;return;}
  let nv=null;
  if(patente){const {data}=await db.from('vehiculos').insert({cliente_id:nc.id,patente,marca:marca||'',modelo:modelo||''}).select().single();nv=data;}
  state.clientes.push(nc); if(nv) state.vehiculos.push(nv);
  const sel=document.getElementById('m-cliente');
  if(sel){const opt=document.createElement('option');opt.value=nc.id;opt.textContent=nc.nombre;opt.selected=true;sel.appendChild(opt);}
  actualizarVehiculos();
  window._ncVisible=false;
  const el=document.getElementById('nuevo-cliente-inline');
  if(el) el.innerHTML=`<div class="success-msg" style="margin-bottom:10px">✅ Cliente "${nc.nombre}" registrado.</div>`;
};
function actualizarVehiculos(){
  const cId=document.getElementById('m-cliente')?.value;
  const vehs=state.vehiculos.filter(v=>v.cliente_id===cId);
  const sel=document.getElementById('m-vehiculo');
  if(sel) sel.innerHTML=vehs.length?vehs.map(v=>`<option value="${v.id}">${v.patente} — ${v.marca} ${v.modelo}</option>`).join(''):'<option value="">— Sin vehículos —</option>';
}
window.addInsumo=function(){
  const sel=document.getElementById('m-stock-sel');
  const qty=parseInt(document.getElementById('m-stock-qty')?.value)||1;
  if(!sel||!sel.value) return;
  const stockId=sel.value;
  const exists=window._insumosSel.findIndex(x=>x.stockId===stockId);
  if(exists>=0) window._insumosSel[exists].qty+=qty;
  else window._insumosSel.push({stockId,qty});
  renderInsumosList();
};
function renderInsumosList(){
  const el=document.getElementById('m-insumos-list'); if(!el) return;
  el.innerHTML=window._insumosSel.map((ins,i)=>{
    const s=getStock(ins.stockId);
    return `<div class="order-item-row"><span>${s?s.nombre:'?'}</span>
      <span>${ins.qty} ${s?s.unidad:'u'} <span style="cursor:pointer;color:#aaa;margin-left:4px" onclick="window._insumosSel.splice(${i},1);renderInsumosList()">×</span></span></div>`;
  }).join('');
}
window.guardarOrden=async function(){
  const vId=document.getElementById('m-vehiculo')?.value;
  const total=parseFloat(document.getElementById('m-total')?.value)||0;
  const notas=document.getElementById('m-notas')?.value||'';
  const empleadoId=document.getElementById('m-empleado')?.value||null;
  const hora=document.getElementById('m-hora')?.value||new Date().toTimeString().slice(0,5);
  const fecha=document.getElementById('m-fecha')?.value||new Date().toISOString().slice(0,10);
  const metodoPago=document.getElementById('m-metodo-pago')?.value||'efectivo';
  const errEl=document.getElementById('orden-error');
  if(!vId||vId===''){if(errEl)errEl.innerHTML='<div class="error-msg">Seleccioná un vehículo válido</div>';return;}
  if(window._serviciosSel.length===0){if(errEl)errEl.innerHTML='<div class="error-msg">Seleccioná al menos un servicio</div>';return;}
  const btn=document.getElementById('btn-guardar-orden');
  if(btn){btn.disabled=true;btn.textContent='Guardando...';}
  const {data:orden,error}=await db.from('ordenes').insert({
    vehiculo_id:vId, estado:'recibido', servicios:window._serviciosSel,
    total, notas, fecha,
    local:state.localActual,
    empleado_id:empleadoId||null,
    hora,
    metodo_pago:metodoPago,
  }).select().single();
  if(error){if(errEl)errEl.innerHTML=`<div class="error-msg">${traducirError(error.message)}</div>`;if(btn){btn.disabled=false;btn.textContent='Guardar orden';}return;}
  for(const ins of window._insumosSel) await db.from('orden_insumos').insert({orden_id:orden.id,stock_id:ins.stockId,cantidad:ins.qty});
  await loadAll(); closeModal();
};

function renderGastos(){
  const filtroLocal = state.localActual;
  const gastosLocal = state.gastos.filter(g=>g.local===filtroLocal);
  const totalGastos = gastosLocal.reduce((s,g)=>s+(g.monto||0),0);
  const totalIngresos = state.ordenes.filter(o=>o.local===filtroLocal).reduce((s,o)=>s+(o.total||0),0);
  const balance = totalIngresos - totalGastos;

  // agrupar por categoría
  const porCategoria = CATEGORIAS_GASTO.map(cat=>{
    const items = gastosLocal.filter(g=>g.categoria===cat.id);
    const total = items.reduce((s,g)=>s+(g.monto||0),0);
    return {cat, items, total};
  }).filter(x=>x.items.length>0);

  return `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
    <div>
      <div style="font-size:15px;font-weight:700">💸 Gastos <span style="font-size:11px;background:#FDD835;padding:2px 8px;border-radius:6px;font-weight:700;margin-left:6px">Solo dueño</span></div>

    </div>

  </div>

    <div class="stat-card">
      <div style="font-size:11px;color:#888;margin-bottom:4px">💰 Ingresos</div>
      <div style="font-size:16px;font-weight:700;color:#3B6D11">${formatMoney(totalIngresos)}</div>
    </div>
    <div class="stat-card">
      <div style="font-size:11px;color:#888;margin-bottom:4px">💸 Gastos</div>
      <div style="font-size:16px;font-weight:700;color:#C0392B">${formatMoney(totalGastos)}</div>
    </div>
    <div class="stat-card" style="background:${balance>=0?'#EAF3DE':'#FCEBEB'};border-color:${balance>=0?'#C0DD97':'#F09595'}">
      <div style="font-size:11px;color:#888;margin-bottom:4px">📊 Balance</div>
      <div style="font-size:16px;font-weight:700;color:${balance>=0?'#3B6D11':'#C0392B'}">${balance>=0?'+':''}${formatMoney(balance)}</div>
    </div>
  </div>

  <!-- Gastos por categoría -->
  ${gastosLocal.length===0?'<div class="empty">No hay gastos registrados para este local</div>':
    porCategoria.map(({cat,items,total})=>`
    <div class="card" style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div style="font-weight:700;font-size:13px">${cat.icon} ${cat.label}</div>
        <div style="font-weight:700;color:#C0392B">${formatMoney(total)}</div>
      </div>
      ${items.map(g=>`
        <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid #f0f0e8;font-size:13px">
          <div>
            <div>${g.descripcion||cat.label}</div>
            <div style="font-size:11px;color:#888">${g.fecha}</div>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <span style="font-weight:600">${formatMoney(g.monto)}</span>
            <button class="btn-danger" style="padding:3px 8px;font-size:11px" onclick="showPin('dueno',()=>borrarGasto('${g.id}'))">🗑</button>
          </div>
        </div>`).join('')}
    </div>`).join('')}`;
}

window.guardarGasto=async function(){
  const local=document.getElementById('g-local')?.value;
  const categoria=document.getElementById('g-cat')?.value;
  const detalle=document.getElementById('g-detalle')?.value.trim()||'';
  const monto=parseFloat(document.getElementById('g-monto')?.value)||0;
  const fecha=document.getElementById('g-fecha')?.value||new Date().toISOString().slice(0,10);
  const cat=getCatGasto(categoria);
  const descripcion=detalle||(cat?cat.label:'');
  const errEl=document.getElementById('gasto-error');
  if(!monto){if(errEl)errEl.innerHTML='<div class="error-msg">El monto es obligatorio</div>';return;}
  const btn=document.getElementById('btn-guardar-gasto');
  if(btn){btn.disabled=true;btn.textContent='Guardando...';}

  if(error){if(errEl)errEl.innerHTML=`<div class="error-msg">${traducirError(error.message)}</div>`;if(btn){btn.disabled=false;btn.textContent='Guardar';}return;}
  await loadAll(); closeModal();
};

window.borrarGasto=async function(id){
  if(!confirm('¿Eliminar este gasto?')) return;
  await db.from('gastos').delete().eq('id',id);
  await loadAll(); render();
};

function renderReportes(){
  // Tomar período: este mes por defecto
  const hoy=new Date();
  const inicioMes=new Date(hoy.getFullYear(),hoy.getMonth(),1).toISOString().slice(0,10);
  const finMes=hoy.toISOString().slice(0,10);
  const ordenesMes=state.ordenes.filter(o=>o.fecha>=inicioMes&&o.fecha<=finMes);

  // 1. Ranking servicios
  const serviciosCount={};
  ordenesMes.forEach(o=>(o.servicios||[]).forEach(s=>{serviciosCount[s]=(serviciosCount[s]||0)+1;}));
  const topServicios=Object.entries(serviciosCount).sort((a,b)=>b[1]-a[1]).slice(0,5);

  // 2. Empleado top
  const empCount={};
  ordenesMes.forEach(o=>{if(o.empleado_id)empCount[o.empleado_id]=(empCount[o.empleado_id]||0)+1;});
  const topEmpleados=Object.entries(empCount).sort((a,b)=>b[1]-a[1]).slice(0,5);

  // 3. Horario pico
  const horaCount={};
  ordenesMes.forEach(o=>{if(o.hora){const h=o.hora.slice(0,2)+':00';horaCount[h]=(horaCount[h]||0)+1;}});
  const topHoras=Object.entries(horaCount).sort((a,b)=>b[1]-a[1]).slice(0,5);

  // 4. Día de la semana pico
  const dias=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const diaCount={};
  ordenesMes.forEach(o=>{const d=dias[new Date(o.fecha+'T12:00:00').getDay()];diaCount[d]=(diaCount[d]||0)+1;});
  const topDias=Object.entries(diaCount).sort((a,b)=>b[1]-a[1]);

  // 5. Clientes frecuentes
  const clienteCount={};
  ordenesMes.forEach(o=>{
    const c=getCliente(o.vehiculo_id);
    if(c) clienteCount[c.id]=(clienteCount[c.id]||0)+1;
  });
  const topClientes=Object.entries(clienteCount).sort((a,b)=>b[1]-a[1]).slice(0,5);

  // 6. Ingresos por local
  const ingresosPorLocal=Object.entries(LOCALES).map(([id,l])=>{
    const total=ordenesMes.filter(o=>o.local===id).reduce((s,o)=>s+(o.total||0),0);
    const cant=ordenesMes.filter(o=>o.local===id).length;
    return {l,total,cant};
  });
  const maxIngreso=Math.max(...ingresosPorLocal.map(x=>x.total),1);

  function barHTML(val,max,color){
    const pct=Math.round(val/max*100);
    return `<div style="background:#f0f0e8;border-radius:4px;height:8px;margin-top:4px"><div style="background:${color};height:8px;border-radius:4px;width:${pct}%"></div></div>`;
  }

  return `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
    <div style="font-size:15px;font-weight:700">📊 Reportes <span style="font-size:11px;background:#FDD835;padding:2px 8px;border-radius:6px;font-weight:700;margin-left:6px">Solo dueño</span></div>
  </div>
  <div style="font-size:12px;color:#888;margin-bottom:16px">Datos del mes actual — ${hoy.toLocaleString('es-AR',{month:'long',year:'numeric'})}</div>

  <!-- Ingresos por local -->
  <div class="card" style="margin-bottom:12px">
    <div style="font-weight:700;font-size:13px;margin-bottom:12px">💰 Ingresos por local</div>
    ${ingresosPorLocal.map(({l,total,cant})=>`
      <div style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;font-size:13px">
          <span style="font-weight:600;color:${l.color}">${l.dot} ${l.nombre}</span>
          <span><strong>${formatMoney(total)}</strong> <span style="color:#888;font-size:12px">(${cant} órd.)</span></span>
        </div>
        ${barHTML(total,maxIngreso,l.color)}
      </div>`).join('')}
  </div>

  <div class="grid2" style="gap:12px;margin-bottom:12px">
    <!-- Servicios más realizados -->
    <div class="card">
      <div style="font-weight:700;font-size:13px;margin-bottom:10px">🔧 Servicios top</div>
      ${topServicios.length===0?'<div style="font-size:12px;color:#888">Sin datos</div>':
        topServicios.map(([s,n],i)=>`
        <div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid #f0f0e8;font-size:13px">
          <span style="color:#888;margin-right:6px">${i+1}.</span><span style="flex:1">${s}</span>
          <span style="font-weight:700;background:#f5f5f0;padding:2px 8px;border-radius:20px;font-size:12px">${n}</span>
        </div>`).join('')}
    </div>

    <!-- Empleados top -->
    <div class="card">
      <div style="font-weight:700;font-size:13px;margin-bottom:10px">👷 Empleados top</div>
      ${topEmpleados.length===0?'<div style="font-size:12px;color:#888">Sin datos</div>':
        topEmpleados.map(([eid,n],i)=>{
          const emp=getEmpleado(eid);
          return `<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid #f0f0e8;font-size:13px">
            <span style="color:#888;margin-right:6px">${i+1}.</span><span style="flex:1">${emp?emp.nombre:'—'}</span>
            <span style="font-weight:700;background:#f5f5f0;padding:2px 8px;border-radius:20px;font-size:12px">${n}</span>
          </div>`;
        }).join('')}
    </div>
  </div>

  <div class="grid2" style="gap:12px;margin-bottom:12px">
    <!-- Horario pico -->
    <div class="card">
      <div style="font-weight:700;font-size:13px;margin-bottom:10px">🕐 Horario pico</div>
      ${topHoras.length===0?'<div style="font-size:12px;color:#888">Sin datos de hora</div>':
        topHoras.map(([h,n],i)=>`
        <div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid #f0f0e8;font-size:13px">
          <span style="color:#888;margin-right:6px">${i+1}.</span><span style="flex:1">${h}hs</span>
          <span style="font-weight:700;background:#f5f5f0;padding:2px 8px;border-radius:20px;font-size:12px">${n}</span>
        </div>`).join('')}
    </div>

    <!-- Día pico -->
    <div class="card">
      <div style="font-weight:700;font-size:13px;margin-bottom:10px">📅 Día más activo</div>
      ${topDias.length===0?'<div style="font-size:12px;color:#888">Sin datos</div>':
        topDias.map(([d,n],i)=>`
        <div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid #f0f0e8;font-size:13px">
          <span style="color:#888;margin-right:6px">${i+1}.</span><span style="flex:1">${d}</span>
          <span style="font-weight:700;background:#f5f5f0;padding:2px 8px;border-radius:20px;font-size:12px">${n}</span>
        </div>`).join('')}
    </div>
  </div>

  <!-- Clientes frecuentes -->
  <div class="card" style="margin-bottom:12px">
    <div style="font-weight:700;font-size:13px;margin-bottom:10px">⭐ Clientes frecuentes</div>
    ${topClientes.length===0?'<div style="font-size:12px;color:#888">Sin datos</div>':
      topClientes.map(([cid,n],i)=>{
        const c=state.clientes.find(x=>x.id===cid);
        const vehs=state.vehiculos.filter(v=>v.cliente_id===cid);
        return `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #f0f0e8">
          <div>
            <div style="font-size:13px;font-weight:600">${i+1}. ${c?c.nombre:'—'}</div>
            <div style="font-size:11px;color:#888">${vehs.map(v=>v.patente).join(' · ')}</div>
          </div>
          <span style="font-weight:700;background:#FDD835;padding:3px 10px;border-radius:20px;font-size:12px">${n} visita${n!==1?'s':''}</span>
        </div>`;
      }).join('')}
  </div>`;
}

};

window.guardarEdicionCliente=async function(id){
  const nombre=document.getElementById('ec-nombre')?.value.trim();
  const telefono=document.getElementById('ec-tel')?.value.trim();
  const email=document.getElementById('ec-email')?.value.trim();
  const errEl=document.getElementById('editar-cliente-error');
  if(!nombre||!telefono){if(errEl)errEl.innerHTML='<div class="error-msg">Nombre y teléfono son obligatorios</div>';return;}
  const btn=document.getElementById('btn-guardar-cliente-edit');
  if(btn){btn.disabled=true;btn.textContent='Guardando...';}
  const {error}=await db.from('clientes').update({nombre,telefono,email:email||null}).eq('id',id);
  if(error){if(errEl)errEl.innerHTML=`<div class="error-msg">${traducirError(error.message)}</div>`;if(btn){btn.disabled=false;btn.textContent='Guardar cambios';}return;}
  const vehs=state.vehiculos.filter(v=>v.cliente_id===id);
  for(const v of vehs){
    const pat=document.getElementById(`veh-pat-${v.id}`)?.value.trim();
    const marca=document.getElementById(`veh-marca-${v.id}`)?.value.trim();
    const modelo=document.getElementById(`veh-modelo-${v.id}`)?.value.trim();
    if(pat) await db.from('vehiculos').update({patente:pat,marca:marca||'',modelo:modelo||''}).eq('id',v.id);

  const newPat=document.getElementById('ec-pat')?.value.trim();
  const newMarca=document.getElementById('ec-marca')?.value.trim();
  const newModelo=document.getElementById('ec-modelo')?.value.trim();
  if(newPat) await db.from('vehiculos').insert({cliente_id:id,patente:newPat,marca:newMarca||'',modelo:newModelo||''});
  await loadAll(); closeModal();
};

        <div class="form-group"><div class="form-label">Patente</div><input class="input" id="nc-pat" placeholder="AB 123 CD"></div>

        <div class="form-group"><div class="form-label">Modelo</div><input class="input" id="nc-modelo" placeholder="Focus 2020"></div>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px">
        <button class="btn" onclick="closeModal()">Cancelar</button>
        <button class="btn btn-primary" id="btn-guardar-cliente" onclick="guardarCliente()">Guardar</button>
      </div>
    </div>
  </div>`;
}
window.guardarCliente=async function(){
  const nombre=document.getElementById('nc-nombre')?.value.trim();
  const telefono=document.getElementById('nc-tel')?.value.trim();
  const email=document.getElementById('nc-email')?.value.trim();
  const patente=document.getElementById('nc-pat')?.value.trim();
  const marca=document.getElementById('nc-marca')?.value.trim();
  const modelo=document.getElementById('nc-modelo')?.value.trim();
  const errEl=document.getElementById('cliente-error');
  if(!nombre||!telefono){if(errEl)errEl.innerHTML='<div class="error-msg">Nombre y teléfono son obligatorios</div>';return;}
  const btn=document.getElementById('btn-guardar-cliente');
  if(btn){btn.disabled=true;btn.textContent='Guardando...';}
  const {data:nc,error}=await db.from('clientes').insert({nombre,telefono,email:email||null}).select().single();
  if(error){if(errEl)errEl.innerHTML=`<div class="error-msg">${traducirError(error.message)}</div>`;if(btn){btn.disabled=false;btn.textContent='Guardar';}return;}
  if(patente) await db.from('vehiculos').insert({cliente_id:nc.id,patente,marca:marca||'',modelo:modelo||''});
  await loadAll(); closeModal();
};

// ═══ NUEVO INSUMO ═════════════════════════════════════════════
function showNuevoInsumo(){
  const localOpts=Object.entries(LOCALES).map(([id,l])=>`<option value="${id}" ${id===state.localActual?'selected':''}>${l.dot} ${l.full}</option>`).join('');
  document.getElementById('modal-container').innerHTML=`
  <div class="modal-overlay" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-title">Agregar insumo al stock</div>
      <div id="insumo-error"></div>
      <div class="form-group"><div class="form-label">Local *</div><select class="select" id="ni-local">${localOpts}</select></div>
      <div class="form-group"><div class="form-label">Nombre del insumo *</div><input class="input" id="ni-nombre" placeholder="Cubierta 195/65 R15"></div>
      <div class="grid3">
        <div class="form-group"><div class="form-label">Cantidad</div><input class="input" type="number" id="ni-qty" value="0" min="0"></div>
        <div class="form-group"><div class="form-label">Mínimo</div><input class="input" type="number" id="ni-min" value="2" min="0"></div>
        <div class="form-group"><div class="form-label">Unidad</div><input class="input" id="ni-unidad" value="unidad"></div>
      </div>
      <div class="form-group"><div class="form-label">Costo unitario ($)</div><input class="input" type="number" id="ni-costo" placeholder="9500"></div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px">
        <button class="btn" onclick="closeModal()">Cancelar</button>
        <button class="btn btn-primary" id="btn-guardar-insumo" onclick="guardarInsumo()">Guardar</button>
      </div>
    </div>
  </div>`;
}
window.guardarInsumo=async function(){
  const local=document.getElementById('ni-local')?.value;
  const nombre=document.getElementById('ni-nombre')?.value.trim();
  const cantidad=parseInt(document.getElementById('ni-qty')?.value)||0;
  const minimo=parseInt(document.getElementById('ni-min')?.value)||0;
  const unidad=document.getElementById('ni-unidad')?.value.trim()||'unidad';
  const costo=parseFloat(document.getElementById('ni-costo')?.value)||0;
  const errEl=document.getElementById('insumo-error');
  if(!nombre){if(errEl)errEl.innerHTML='<div class="error-msg">El nombre es obligatorio</div>';return;}
  const btn=document.getElementById('btn-guardar-insumo');
  if(btn){btn.disabled=true;btn.textContent='Guardando...';}
  const {error}=await db.from('stock').insert({nombre,cantidad,minimo,unidad,costo,local});
  if(error){if(errEl)errEl.innerHTML=`<div class="error-msg">${traducirError(error.message)}</div>`;if(btn){btn.disabled=false;btn.textContent='Guardar';}return;}
  await loadAll(); closeModal();
};

function closeModal(e){
  if(e&&e.target!==e.currentTarget) return;
  document.getElementById('modal-container').innerHTML='';
  state.pinEmpleadoOk=false;
  state.pinDuenoOk=false;
  state.empleadoActual=null;
  render();
}

loadAll();
</script>
</body>
</html>
